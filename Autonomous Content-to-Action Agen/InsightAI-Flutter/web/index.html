<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="InsightAI — Autonomous Content-to-Action Agent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InsightAI</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { background: #0a0a0f; margin: 0; padding: 0; }
    #loading {
      position: fixed; inset: 0; background: #0a0a0f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; z-index: 9999;
    }
    .load-icon {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #6c63ff, #22d3ee);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; box-shadow: 0 0 40px rgba(108,99,255,0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .load-title { font-family: sans-serif; font-size: 22px; font-weight: 800; color: #e2e8f0; letter-spacing: -0.5px; }
    .load-title span { color: #a78bfa; }
    .load-bar { width: 200px; height: 3px; background: #2a2a4a; border-radius: 2px; overflow: hidden; }
    .load-fill { height: 100%; background: linear-gradient(90deg,#6c63ff,#22d3ee); border-radius: 2px; animation: fill 1.6s ease-in-out infinite; }
    @keyframes fill { 0%{width:0%} 100%{width:100%} }
    .load-sub { font-family: monospace; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="load-icon">⚡</div>
    <div class="load-title">Insight<span>AI</span></div>
    <div class="load-bar"><div class="load-fill"></div></div>
    <div class="load-sub">Initializing ADK runtime...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
